name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config \
            libjansson-dev libssl-dev libapt-pkg-dev

      - name: Check out rapt (ownership-predicate drift gate)
        uses: actions/checkout@v6
        with:
          repository: cornball-ai/rapt
          path: rapt-src

      - name: Tests (ASan/UBSan)
        run: make check

      - name: rapt predicate drift gate
        # PKGEXEC_RAPT_MANAGER set => absence is a failure, not a skip.
        run: PKGEXEC_RAPT_MANAGER="$GITHUB_WORKSPACE/rapt-src/r-pkg/R/manager.R" make test-rapt

      - name: Hardened build gate
        run: make clean && make all

      - name: Read-only libapt-pkg API probe (step 0)
        run: make probe && ./pkgexec-probe bash

      - name: Locked libapt resolve — link check (slice 2, not run in CI)
        run: make plan   # compile+link only; runtime takes the dpkg lock (VM-gated)

      - name: Read-only planner (preview) — link check + apt-independent emit smoke
        run: |
          make preview
          # the schema_invalid path returns before opening any cache, so it is
          # deterministic in CI (no apt state, no lock). Prove the binary emits the
          # uniform shape and exits nonzero for a non-ok/no_op status.
          out=$(printf 'not json' | ./runix-apt-preview) || rc=$?
          echo "$out"
          echo "$out" | grep -q '"schema_version":1,"status":"schema_invalid"'
          test "${rc:-0}" -ne 0

      - name: Commit effectors (all four) — link check (not run in CI)
        run: make effect  # compile+link only; commits require root+broker (VM-gated)

      - name: Nine per-verb entrypoints — link check (not run in CI)
        run: make entrypoints  # compile+link only; each bakes its verb, VM-gated runtime

      - name: Fuzz the request parser
        run: |
          make fuzz CC=clang
          ./fuzz-request -runs=300000 -max_total_time=45 fuzz/corpus
          ./fuzz-request -runs=300000 -max_total_time=45

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper pkg-config \
            libjansson-dev libssl-dev libapt-pkg-dev

      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Install / list / remove smoke
        run: |
          sudo dpkg -i ../pkgexec_*.deb
          dpkg -L pkgexec
          test -f /usr/share/doc/pkgexec/README.md
          dpkg -L pkgexec | grep -q plan-digest-vectors   # .gz after dh_compress
          # nine per-verb entrypoints installed and executable
          for v in update install remove purge upgrade dist-upgrade configure hold unhold; do
            test -x "/usr/libexec/pkgexec/runix-apt-$v"
          done
          test "$(ls /usr/libexec/pkgexec/runix-apt-* | wc -l)" = 9
          # polkit action + autonomous-verb rule
          test -f /usr/share/polkit-1/actions/ai.cornball.runix.apt.policy
          test -f /usr/share/polkit-1/rules.d/49-runix-apt-autonomous.rules
          # the autonomous group is created empty (no members)
          getent group runix-apt-autonomous
          test -z "$(getent group runix-apt-autonomous | cut -d: -f4)"
          # an entrypoint fails closed with no PKEXEC_UID (never reaches the broker)
          if echo '{}' | /usr/libexec/pkgexec/runix-apt-update; then
            echo "entrypoint should fail without PKEXEC_UID"; exit 1
          fi
          # the unprivileged planner is installed on PATH and runs unprivileged
          test -x /usr/bin/runix-apt-preview
          # schema_invalid never opens the cache, so it is deterministic
          si=$(printf 'not json' | runix-apt-preview) || true
          echo "$si" | grep -q '"schema_version":1,"status":"schema_invalid"'
          # end-to-end on the runner's real (path-signed) sources: one JSON object
          upd=$(printf '{"schema_version":1,"verb":"apt.update","packages":[]}' | runix-apt-preview) || true
          echo "$upd" | grep -q '"schema_version":1'
          echo "$upd" | grep -q '"verb":"apt.update"'
          sudo dpkg -r pkgexec
